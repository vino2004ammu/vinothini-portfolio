<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="50%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#070c17" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0a980" />
      <stop offset="100%" stop-color="#c98a5e" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18" />
      <stop offset="100%" stop-color="#090807" />
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Subtle Tech Grid Lines in Background -->
  <path d="M 50,150 L 350,150 M 50,250 L 350,250 M 150,50 L 150,350 M 250,50 L 250,350" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.15" />

  <!-- Back Hair (Flowing) -->
  <path d="M 120,160 Q 110,260 130,310 Q 160,330 180,310 Q 140,240 145,170 Z" fill="url(#hairGrad)" />
  <path d="M 280,160 Q 290,260 270,310 Q 240,330 220,310 Q 260,240 255,170 Z" fill="url(#hairGrad)" />

  <!-- Shoulders & Blazer -->
  <path d="M 90,380 C 100,320 135,280 170,270 L 200,300 L 230,270 C 265,280 300,320 310,380 Z" fill="url(#clothGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Lapel / Shirt Collar with Gold Accent -->
  <polygon points="175,270 200,325 225,270 200,285" fill="#f8fafc" />
  <polygon points="188,285 200,340 212,285" fill="url(#amberGrad)" opacity="0.9" />

  <!-- Neck -->
  <path d="M 180,220 L 180,275 Q 200,285 220,275 L 220,220 Z" fill="url(#skinGrad)" />

  <!-- Head Base / Jaw -->
  <path d="M 140,160 C 140,230 165,260 200,260 C 235,260 260,230 260,160 C 260,110 235,90 200,90 C 165,90 140,110 140,160 Z" fill="url(#skinGrad)" />

  <!-- Main Hair Style (Modern professional parted hair) -->
  <path d="M 135,160 C 135,100 160,70 200,70 C 245,70 265,100 265,155 C 265,175 258,185 250,180 C 245,150 235,120 200,120 C 165,120 150,140 145,175 C 140,180 135,175 135,160 Z" fill="url(#hairGrad)" />

  <!-- Eyebrows -->
  <path d="M 160,150 Q 175,145 188,150" stroke="#1e1b18" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 212,150 Q 225,145 240,150" stroke="#1e1b18" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Eyes -->
  <ellipse cx="174" cy="162" rx="7" ry="5" fill="#1e1b18" />
  <circle cx="172" cy="160" r="2" fill="#ffffff" />
  <ellipse cx="226" cy="162" rx="7" ry="5" fill="#1e1b18" />
  <circle cx="224" cy="160" r="2" fill="#ffffff" />

  <!-- Stylish Glasses (Tech Developer Style in Amber Gold) -->
  <rect x="155" y="152" width="36" height="22" rx="6" fill="none" stroke="url(#amberGrad)" stroke-width="2.5" />
  <rect x="209" y="152" width="36" height="22" rx="6" fill="none" stroke="url(#amberGrad)" stroke-width="2.5" />
  <path d="M 191,162 L 209,162" stroke="url(#amberGrad)" stroke-width="2.5" />
  <path d="M 155,160 L 142,156" stroke="url(#amberGrad)" stroke-width="2" />
  <path d="M 245,160 L 258,156" stroke="url(#amberGrad)" stroke-width="2" />

  <!-- Nose & Smile -->
  <path d="M 200,165 L 197,185 L 203,185" stroke="#b2734a" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 185,208 Q 200,220 215,208" stroke="#993d3d" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Small Amber Earrings -->
  <circle cx="140" cy="180" r="4" fill="url(#amberGrad)" />
  <circle cx="260" cy="180" r="4" fill="url(#amberGrad)" />

  <!-- Subtle Code Brackets Glow in Foreground -->
  <g opacity="0.35" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round">
    <path d="M 60,190 L 45,200 L 60,210" />
    <path d="M 340,190 L 355,200 L 340,210" />
  </g>
</svg>
